; =====================================================================================================================
;  README - Painter Momopie texture pack folder
; =====================================================================================================================
;  (This file is only a note; the game ignores it. It is written in ini style so that any text editor opens it.)
;
;  This folder holds the picture sheets of the game, enlarged, in plain Game Boy greys. Paint over them with full colour
;  and the native player (game_win.exe) shows your colours instead of the four greys of the Game Boy.
;
;  How to use it
;  -------------
;   1. Open one of the PNG sheets in an image editor (Aseprite, GIMP, Krita, Photoshop, Paint.NET ...).
;   2. Paint any colours you like. Transparent pixels (alpha) are allowed for sprites.
;   3. Save the PNG with the SAME NAME and the SAME SIZE. Do not rename, crop or resize the sheets.
;   4. Start the game. Only the tiles you changed are replaced; everything else keeps the Game Boy look.
;
;  The folder is chosen by the key  texture_pack  in painter_momopie.ini (or the Textures box of settings.exe).
;  A level pack can also carry its own folders: one for the whole pack and one per level (tools/level_editor.py,
;  tab "Custom tiles"). A level's folder is used only while that level is played, so a Halloween level can have
;  its own enemies, floors and buildings without changing the other levels.
;
;  The sheets
;  ----------
;   2_4000_SpriteTiles.png   player, enemies, effects, the sprites shared by all rounds
;   2_4700_SpriteSet0.png    tile set of the looks 0-2 (floor, walls, props)
;   2_5000_SpriteSet1.png    tile set of the looks 12-14 and 16
;   2_5900_SpriteSet2.png    tile set of the looks 8-10
;   2_6200_SpriteSet3.png    tile set of the looks 3-6 and 11
;   2_6b00_SpriteSet4.png    tile set of the looks 7 and 15
;   3_4000_TilesTitle.png    title screen
;   3_5000_TilesIcons.png    the magic screen, HUD icons, the font
;   3_6000_TilesEnding.png   ending screens
;   3_6e10_TilesFont2.png    the second font
;
;  Rules
;  -----
;   * Each sheet is 128 x N pixels wide: 16 tiles per row, every tile 8 x N pixels square. N (the enlargement) can be 1 to 8
;     and can differ from sheet to sheet. The larger N, the finer your pictures (N = 4 gives 32 x 32 pixels per tile).
;   * The game picture becomes 160 x N' pixels wide where N' is the largest N of all loaded sheets.
;   * A pixel you do not touch stays transparent in sprites. To make a pixel solid, paint it.
;   * Identical tiles share one replacement: if the same 8 x 8 picture is used for the floor of two rooms, painting it
;     once changes both. Tiles that differ are separate.
;   * The Game Boy screen fades (between screens) lighten replaced tiles towards white as well.
;
;  Making a template folder again
;  ------------------------------
;     python tools/export_textures.py --scale 4 --out textures
;  (needs assets/gfx from  python tools/gb_dis.py --write , which reads your own copy of the game ROM; the sheets are
;   made from the game's graphics and are therefore not part of the source repository.)
;
;  More: docs/TEXTURES.md and docs/LEVELS.md.
