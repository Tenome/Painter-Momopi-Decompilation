; Easiest: edit these with settings.exe (the settings window next to game_win.exe).
; Options of the native Painter Momopie player. Put this file next to game_win.exe (or start the program in the folder that holds it).
; A missing file or key means the default shown here.

[display]
scale=4              ; window size in multiples of the 160x144 picture
fullscreen=0         ; 1 = start in full screen (F11 switches at any time)
integer_scale=1      ; 1 = sharp whole-number scaling, 0 = fill the window keeping the aspect ratio
palette=0            ; 0 = Game Boy green, 1 = grey, 2 = sepia (F2 cycles)
widescreen=0         ; 0-40: extra pixels of the room shown on each side during play (0 = the original 160 pixel view; 40 = 240 wide)
texture_pack=textures ; folder of full-colour PNG sheets that replace tiles (see docs/TEXTURES.md); empty or missing = the Game Boy look
no_sprite_limit=0    ; 1 = draw every sprite: no 40 sprite hardware limit, so no flicker when many objects are on screen

[audio]
volume=100           ; 0-100
mute=0               ; 1 = start muted (M toggles)

[game]
level_pack=          ; a .pmpack level pack (make one with tools/level_editor.py); empty = the game's own 33 rounds
speed=100            ; percent of the original speed, 50-400; other than 100 plays without sound
infinite_lives=0     ; 1 = lives never decrease
all_cards=0          ; 1 = all nine magic cards from the start
infinite_magic=0     ; 1 = casting costs no magic points
no_time_limit=0      ; 1 = the round clock stops
start_lives=3        ; lives at the start (1-99)
start_round=0        ; 0 = round 1; 1-33 = the round a one player game starts in
